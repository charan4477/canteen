<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Canteen - My Orders</title>
    <link rel="stylesheet" href="css/style.css" />
</head>

<body>
    <header class="topbar">
        <a class="brand" href="index.html"><span class="logo">C</span> Canteen</a>
        <nav>
            <a href="index.html" class="navlink">Menu</a>
            <a href="orders.html" class="navlink active">My orders</a>
            <span id="who" class="muted"></span>
            <a href="manager.html" class="btn ghost">Staff</a>
            <button id="logoutBtn" class="btn ghost">Sign out</button>
        </nav>
    </header>

    <main class="page">
        <div class="row-between">
            <h2>Order status</h2>
            <div class="row-between">
                <span id="updated" class="muted small"></span>
                <button id="refreshBtn" class="btn ghost">Refresh</button>
            </div>
        </div>
        <div id="active" class="orders"></div>

        <h2 class="section-title">Past orders</h2>
        <div id="past" class="orders"></div>
    </main>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/orders.js"></script>
</body>

</html>
